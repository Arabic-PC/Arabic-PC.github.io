<style>
/* تخطيط: عمود واحد من اليمين لليسار بعرض 1120px، رأس صغير، بطل مقسوم (نص + نافذة البرنامج)، ثم شبكة ألعاب */
:root {
  --bg: #0D1119;
  --surface: #151B27;
  --surface-2: #1C2433;
  --line: #273145;
  --fg: #ECEFF5;
  --muted: #8F99AE;
  --gold: #E2AA52;
  --gold-ink: #1E1606;
  --ok: #46C48C;
  --danger: #E07A62;
  --pause: #F2994A;
  --info: #6C9EF0;
  --scan: rgba(226, 170, 82, .06);

  --f-display: "Noto Kufi Arabic", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;

  --r: 14px;
  --wrap: 1120px;
  --t-fast: .15s;
  --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F2F4F8; --surface: #FFFFFF; --surface-2: #EAEEF4; --line: #D7DDE7;
    --fg: #131925; --muted: #586377; --gold: #8A5A10; --gold-ink: #FFF9EE;
    --ok: #14734A; --danger: #B23A22; --pause: #9A4E0C; --info: #2F67C7; --scan: rgba(169, 113, 26, .07);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F2F4F8; --surface: #FFFFFF; --surface-2: #EAEEF4; --line: #D7DDE7;
  --fg: #131925; --muted: #586377; --gold: #8A5A10; --gold-ink: #FFF9EE;
  --ok: #14734A; --danger: #B23A22; --pause: #9A4E0C; --info: #2F67C7; --scan: rgba(169, 113, 26, .07);
  color-scheme: light;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.75; }
.page { padding-inline: 20px; padding-block: 0 48px; }
.wrap { max-width: var(--wrap); margin-inline: auto; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.mono { font-family: var(--f-mono); font-size: .86em; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

/* الرأس */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.mark { display: block; flex: none; width: 40px; height: 40px; }   /* شعار الموقع الأصلي img/icon.png */
.brand b { font-family: var(--f-display); font-size: 20px; font-weight: 600; }
.nav { display: flex; gap: 22px; font-size: 15px; color: var(--muted); }
.nav a { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; transition: color var(--t-fast); }
.nav a:hover { color: var(--fg); }

/* حسابات التواصل */
.soc { display: flex; gap: 8px; }
.soc-btn { width: 44px; height: 44px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--fg); text-decoration: none; transition: border-color .15s, color .15s; }
.soc-btn:hover { border-color: var(--gold); }
.ic { display: block; width: 20px; height: 20px; }
.ic-x { color: var(--fg); }
.top { flex-wrap: nowrap; }
.top .brand { margin-inline-end: 16px; }
.top .soc { margin-inline-start: auto; }
.community { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.community .comm { grid-template-columns: auto 1fr; }
.community .comm-go { grid-column: 2; }
.comm { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 20px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; transition: border-color .2s, transform .2s; }
@media (hover: hover) {
  .comm:hover { border-color: var(--gold); transform: translateY(-2px); }
}
.comm-ic { width: 52px; height: 52px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--gold); }
.comm-ic .ic { width: 26px; height: 26px; }
.comm-t { display: grid; gap: 4px; min-width: 0; }
.comm-t b { font-size: 17px; }
.comm-t span { color: var(--muted); font-size: 14px; }
.comm-go { color: var(--gold); font-weight: 600; font-size: 14.5px; white-space: nowrap; }
.foot-soc { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 2px; }
.foot-soc a { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; border: 1px solid transparent; border-radius: 11px; color: var(--fg); text-decoration: none; transition: color var(--t-fast), border-color .15s; }
.foot-soc .ic { width: 18px; height: 18px; }
.foot-soc .foot-rep { min-width: 180px; margin-inline-start: 10px; padding-inline: 18px; border: 1px solid var(--gold); border-radius: 10px; font-weight: 600; transition: background .15s; }
.foot-soc .foot-rep:hover { background: var(--surface-2); }
.foot-soc a:hover { color: var(--gold); }
.foot-soc a:not(.foot-rep):hover { border-color: var(--gold); color: var(--fg); }
.dl-note a { color: var(--gold); }

/* الأزرار */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding-inline: 26px;
  border-radius: 12px; font: 600 16px/1 var(--f-body); text-decoration: none; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--fg); cursor: pointer; transition: background var(--t-fast), filter var(--t-fast), transform var(--t-fast); }
.btn:hover { background: var(--line); }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: transparent; }
.btn.gold:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }

/* شارات */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 64px; height: 30px; font-size: 13px; line-height: 1; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.pc { color: var(--fg); font-weight: 700; letter-spacing: .06em; direction: ltr; }
.chip.on { color: var(--ok); }
.chip.upcoming { color: var(--gold); }
.chip.upcoming::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.game.upcoming:hover { border-color: var(--line); transform: none; }
.game-when { color: var(--gold); font-weight: 600; font-size: 14.5px; }
.chip.on::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

/* الأقسام */
section { padding-block: 56px 8px; }
.eyebrow { font-size: 13px; letter-spacing: .04em; color: var(--gold); font-weight: 600; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-block-end: 24px; }
.sec-head h2 { font-family: var(--f-display); font-size: clamp(26px, 4vw, 34px); font-weight: 600; line-height: 1.3; }
.lead { color: var(--muted); max-width: 62ch; }

/* نافذة البرنامج المصغّرة */
.app { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px;
  box-shadow: 0 30px 60px -30px rgba(0,0,0,.55); max-width: 100%; }
.app-top { display: flex; justify-content: space-between; align-items: start; }
.app-brand { font-size: 12px; color: var(--gold); font-weight: 600; }
.app-title { font-size: 20px; font-weight: 700; }
.app-dots { display: flex; flex: none; gap: 10px; color: var(--muted); font-size: 14px; white-space: nowrap; }
.app-card { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.app-label { font-size: 11px; color: var(--muted); }
.app-path { font-family: var(--f-mono); font-size: 12px; direction: ltr; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-status { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--info); box-shadow: 0 0 0 5px color-mix(in srgb, var(--info) 22%, transparent); flex: none; transition: background .18s, box-shadow .18s; }
/* الجملتان في نفس المكان عشان طول النافذة ما يتغير */
.app-msg { display: grid; font-size: 12.5px; color: var(--muted); margin-block-start: 4px; }
.app .app-msg span, .app.running .app-msg span { display: block; grid-area: 1 / 1; transition: opacity .2s; }
.app .app-msg .s0, .app .app-msg .s1, .app.running .app-msg .s2, .app.ready .app-msg .s2 { opacity: 0; }
.app.running .app-msg .s1, .app.ready .app-msg .s0 { opacity: 1; }
.bar { height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; margin-block-start: 12px; display: flex; justify-content: flex-start; }
.bar i { display: block; height: 100%; width: 100%; background: var(--gold); border-radius: 99px; }
.bar-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-block-start: 6px; }
.bar-meta b { color: var(--fg); font-family: var(--f-mono); font-weight: 500; }
.app-btns { display: grid; grid-template-columns: 1.6fr 1fr 1.1fr; gap: 8px; }
.app-btns > span { border-radius: 10px; text-align: center; padding-block: 10px; font-size: 13px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); }
.app-btns > .off { color: var(--muted); transition: background .2s, color .2s, border-color .2s, transform .12s, filter .12s; }
.app.ready .app-btns > .go { background: var(--gold); color: var(--gold-ink); border-color: transparent; }
.app.press .app-btns > .go { transform: scale(.95); filter: brightness(.9); }
.app-foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }

/* حالة نافذة البرنامج: تبدأ "جارٍ التركيب" ثم تتحول للنجاح (يتحكم بها سكربت صغير؛ بدون سكربت تظهر حالة النجاح) */
.app .s0, .app .s1 { display: none; }
.app.ready .s0 { display: block; }
.app.ready .s2 { display: none; }
.app.ready .bar, .app.ready .bar-meta { visibility: hidden; }
#mockName, #mockPath, #mockVer { transition: opacity .2s ease; }
.app.swap #mockName, .app.swap #mockPath, .app.swap #mockVer { opacity: 0; }
.app.running .s1 { display: block; }
.app.running .s2 { display: none; }
.app:not(.running):not(.ready) .dot { background: var(--ok); box-shadow: 0 0 0 5px color-mix(in srgb, var(--ok) 22%, transparent); }

/* البطل */
.hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 48px; align-items: center; padding-block: 40px 24px; }
.hero > * { min-width: 0; }
.hero h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(42px, 7vw, 72px); line-height: 1.35; margin-block: 10px 18px; }
.hero h1 em { font-style: normal; color: var(--gold); }
.hero .lead { font-size: 18px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block: 28px 18px; }
.hero-note { font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.hero-note::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }

/* بطاقات الألعاب */
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 20px; }
.game { display: grid; grid-template-rows: auto 1fr; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; transition: border-color .2s, transform .2s; }
@media (hover: hover) {
  .game:hover { border-color: var(--gold); transform: translateY(-2px); }
}
.art { position: relative; aspect-ratio: 16 / 9; max-width: 100%; padding: 16px 18px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
  background: repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 4px), linear-gradient(160deg, var(--surface-2), var(--bg)); }
.art .term { font-family: var(--f-mono); font-size: 12px; color: var(--gold); direction: ltr; text-align: left; line-height: 1.6; opacity: .9; }
.art .term span { color: var(--muted); }
.art .name { font-family: var(--f-body); font-weight: 700; font-size: 30px; letter-spacing: .04em; direction: ltr; text-align: left; }
.game-body { padding: 16px 18px 18px; display: grid; grid-template-rows: auto 1fr auto auto; gap: 12px; }
.game-body p { color: var(--muted); font-size: 14.5px; }
.game-go { color: var(--gold); font-weight: 600; font-size: 14.5px; }
.art.shot { background: var(--bg); padding: 0; justify-content: flex-end; }
.art.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.art.shot::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(8,11,17,.92) 0%, rgba(8,11,17,.35) 45%, rgba(8,11,17,0) 70%); }
.art.shot.cover { aspect-ratio: 16 / 9; }
.art.shot.cover::after { display: none; }
.game-name { font-size: 19px; font-weight: 700; direction: ltr; text-align: right; }
.art.shot .name { position: relative; z-index: 1; padding: 14px 18px; color: #F2F4F8; }
.plat { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.plat b { font-weight: 600; color: var(--fg); font-size: 13px; padding: 2px 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.g-shot { margin: 22px 0 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.g-shot img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; }
.g-shot figcaption { font-size: 13px; color: var(--muted); padding: 10px 14px; }
/* معرض اللقطات */
.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-block-start: 14px; }
.gallery figure:first-child, .gallery figure:last-child:nth-child(even) { grid-column: 1 / -1; }
.gallery figure { margin: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.gallery img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; transition: transform .3s; }
.gallery .zoom { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; overflow: hidden; }
@media (hover: hover) {
  .gallery .zoom:hover img { transform: scale(1.04); }
}
.gallery .zoom:focus-visible { outline-offset: -3px; }
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(5,7,12,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 16px; cursor: zoom-out; }
.lb[hidden] { display: none; }
.lb img { max-width: 100%; max-height: calc(100% - 60px); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.lb p { color: #C9D0DD; font-size: 14px; }
.lb-x { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 16px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; font-size: 18px; cursor: pointer; }
.gallery figcaption { font-size: 12.5px; color: var(--muted); padding: 8px 10px; }
@media (max-width: 640px) { .gallery { grid-template-columns: 1fr; } }
/* لعبة واحدة متاحة: البطاقة تمتد أفقياً بدل أن تبقى وحيدة في الصف */
.games:has(> .game:only-child) { grid-template-columns: 1fr; }
.game:only-child { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.game:only-child .art { aspect-ratio: auto; min-height: 230px; }
.game:only-child .game-body { align-content: center; padding: 24px 28px; }
.game:only-child .game-body p { font-size: 15.5px; }

.soon { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-block-start: 22px; color: var(--muted); font-size: 14px; }
.soon b { font-weight: 600; color: var(--fg); }

/* الخطوات */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.steps li::before { counter-increment: s; content: counter(s); font-family: var(--f-display); font-size: 34px; font-weight: 700; color: var(--gold); line-height: 1; }
.steps h3 { font-size: 18px; font-weight: 600; }
.steps p { color: var(--muted); font-size: 14.5px; }

/* الوعود */
.promises { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; border-top: 1px solid var(--line); }
.promises div { padding: 22px 4px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; padding-inline-end: 28px; min-width: 0; }
.promises h3 { font-size: 17px; font-weight: 600; }
.promises p { color: var(--muted); font-size: 14.5px; }

/* الأسئلة */
.faq { display: grid; gap: 10px; max-width: 820px; }
.faq details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 18px; transition: border-color .2s; }
@media (hover: hover) {
  .faq details:hover { border-color: var(--gold); }
}
.faq summary { cursor: pointer; font-weight: 600; padding-block: 14px; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.faq summary::after { content: "+"; color: var(--gold); font-size: 20px; line-height: 1; }
.faq details[open] summary::after { content: "−"; }
.faq summary::-webkit-details-marker { display: none; }
.faq details p { color: var(--muted); padding-block-end: 16px; font-size: 15px; }
.faq bdi { white-space: nowrap; }

/* التذييل */
.foot { margin-block-start: 64px; padding-block: 28px 0; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 13.5px; }
.foot strong { color: var(--fg); font-weight: 600; }

/* صفحة اللعبة */
.crumb { font-size: 14px; color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; transition: color var(--t-fast); }
.crumb:hover { color: var(--fg); }
.g-head { display: grid; grid-template-columns: 1fr 360px; gap: 40px; align-items: start; padding-block: 18px 0; }
.g-head > * { min-width: 0; }
.g-title { font-family: var(--f-body); font-weight: 700; font-size: clamp(44px, 8vw, 76px); letter-spacing: .04em; direction: ltr; text-align: right; line-height: 1.1; }
.g-sub { font-family: var(--f-display); font-size: 22px; color: var(--gold); margin-block: 6px 16px; }
.g-aka { margin-block: -8px 16px; color: var(--muted); font-size: 15px; }
.dl { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 14px; }
.dl .btn { width: 100%; min-height: 58px; font-size: 18px; }
.dl dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; text-align: left; font-variant-numeric: tabular-nums; }
.dl-note { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.g-main { display: grid; gap: 8px; }
.g-main section { padding-block: 40px 0; }
.g-main h2 { font-family: var(--f-display); font-size: 26px; font-weight: 600; margin-block-end: 14px; }
.g-main p, .g-main li { color: var(--muted); }
.g-main ul { padding-inline-start: 20px; margin: 0; display: grid; gap: 6px; }

.sample { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-block-start: 16px; }
.sample div { padding: 14px 18px; }
.sample .en { direction: ltr; text-align: left; color: var(--muted); font-size: 14.5px; border-bottom: 1px dashed var(--line); }
.sample .ar { font-size: 18px; color: var(--fg); }
.sample .ar b { color: var(--gold); font-weight: 600; }
.sample small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .04em; margin-block-end: 2px; }

.gsteps { list-style: none; counter-reset: s; padding: 0; margin: 0; display: grid; gap: 14px; }
.gsteps > li { display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: start; }
.gsteps > li::before { counter-increment: s; content: counter(s); width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; color: var(--gold); font-size: 20px; background: var(--surface); }
.gsteps h3 { font-size: 17px; font-weight: 600; color: var(--fg); margin-block: 8px 2px; }
.gsteps > li > div { min-width: 0; }

/* رسم توضيحي لتحذير ويندوز */
.warn { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-block-start: 14px; }
.ss { background: #0B5CAD; color: #fff; border-radius: 10px; padding: 16px 16px 14px; direction: ltr; text-align: left; font-family: "Segoe UI", Tahoma, sans-serif; display: grid; gap: 8px; align-content: start; min-height: 168px; position: relative; min-width: 0; }
.ss-t { display: block; font-size: 17px; font-weight: 600; line-height: 1.35; }
.ss p { color: #DCEBFA !important; font-size: 12px; line-height: 1.45; }
.ss .more { color: #fff; text-decoration: underline; font-size: 12px; outline: 2px solid #FFD27A; outline-offset: 3px; border-radius: 3px; justify-self: start; }
.ss .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: auto; }
.ss .row span { border: 1px solid #fff; padding: 4px 14px; font-size: 12px; }
.ss .row .hl { outline: 2px solid #FFD27A; outline-offset: 3px; border-radius: 3px; }
.ss-cap { font-size: 13px; color: var(--muted); margin-block-start: 6px; text-align: right; direction: rtl; }

.tech { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 18px; overflow-x: auto; }
.tech table { width: 100%; border-collapse: collapse; font-size: 14px; }
.tech td { padding: 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tech tr:last-child td { border-bottom: 0; }
.tech td:first-child { color: var(--muted); padding-inline-end: 18px; white-space: nowrap; }
.tech td:last-child { direction: ltr; text-align: left; font-family: var(--f-mono); font-size: 12.5px; overflow-wrap: anywhere; }
.tl { display: block; }
.tl-ar { font-family: var(--f-body); font-size: 13.5px; }

.preview-note { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; }

/* الوصول للتنزيل: زر أعلى الصفحة وشريط سفلي في الشاشات الصغيرة، وإرسال الرابط للكمبيوتر من الجوال */
#get { scroll-margin-top: 16px; }
p.dl-pc { margin: 0; font-size: 14px; font-weight: 600; color: var(--fg); text-align: center; }
.dl-jump-box, .to-get, .dl-bar { display: none; }
#dlSend { font-family: var(--f-body); }
#dlSend[hidden], .dl-sent[hidden] { display: none; }
.dl-sent { font-size: 13.5px; color: var(--muted); text-align: center; overflow-wrap: anywhere; }
.is-phone #dlBtn { background: var(--surface-2); color: var(--fg); border-color: var(--line); min-height: 50px; font-size: 16px; }

/* شرح تحذير ويندوز */
.warn-why { margin-block-start: 10px; }
.warn-next { margin-block-start: 14px; }
.warn-more { margin-block-start: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; }
.warn-more summary { cursor: pointer; font-weight: 600; color: var(--fg); min-height: 48px; padding-block: 10px; line-height: 1.5; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.warn-more summary::after { content: "+"; color: var(--gold); font-size: 20px; line-height: 1; }
.warn-more[open] summary::after { content: "−"; }
.warn-more summary::-webkit-details-marker { display: none; }
.warn-more p { font-size: 14.5px; padding-block-end: 12px; }
.warn-more a { color: var(--fg); }
.warn-more bdi { white-space: nowrap; }

/* الحركة: انتقال بين الصفحات، وفتح الأسئلة والمكبّر، وإشارة الوصول لصندوق التنزيل */
@media (prefers-reduced-motion: no-preference) {
  @view-transition { navigation: auto; }
  ::view-transition-group(*) { animation-duration: .32s; animation-timing-function: var(--ease); }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .18s; }
  html:has(.hero) { scroll-behavior: smooth; }
  .lb:not([hidden]) { animation: fade-in .18s ease-out; }
  .lb:not([hidden]) img { animation: lb-img .24s var(--ease); }
  #get:target { animation: get-hit .9s ease-out; }
  @supports (interpolate-size: allow-keywords) {
    .faq details, .warn-more { interpolate-size: allow-keywords; }
    .faq details::details-content, .warn-more::details-content { block-size: 0; overflow: clip; transition: block-size .14s ease-in, content-visibility .14s allow-discrete; }
    .faq details[open]::details-content, .warn-more[open]::details-content { block-size: auto; transition: block-size .22s var(--ease), content-visibility .22s allow-discrete; }
  }
}
@media (prefers-reduced-motion: reduce) {
  .game, .comm, .gallery img, .yt img, .btn { transition-property: border-color, background, filter; }
  .comm:hover, .game:hover, .gallery .zoom:hover img, .yt:hover img, .btn:active { transform: none; }
}
@keyframes fade-in { from { opacity: 0; } }
@keyframes lb-img { from { transform: scale(.97); } }
@keyframes get-hit { from { box-shadow: 0 0 0 3px var(--gold); } to { box-shadow: 0 0 0 3px transparent; } }

/* نافذة البلاغ فوق الصفحة، وصفحة البلاغ لما تنعرض داخلها */
html:has(.rep-dlg[open]) { overflow: hidden; }
.rep-dlg { width: min(640px, 100% - 32px); max-width: none; height: min(780px, 100dvh - 48px); max-height: none; padding: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--fg); overflow: hidden; }
.rep-dlg[open] { animation: rep-dlg-in .18s ease-out; }
.rep-dlg::backdrop { background: rgba(5, 7, 12, .62); }
.rep-dlg iframe { display: block; width: 100%; height: 100%; border: 0; }
.rep-dlg-x { position: absolute; top: 12px; inset-inline-end: 12px; z-index: 1; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-size: 16px; cursor: pointer; }
.rep-dlg-x:hover { border-color: var(--gold); }
@keyframes rep-dlg-in { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { .rep-dlg[open] { animation: none; } }
@media (max-width: 640px) {
  .rep-dlg { width: 100%; height: 92dvh; margin: auto 0 0; border-width: 1px 0 0; border-radius: 18px 18px 0 0; }
}
.embed body { background: var(--surface); }
.embed .page { padding: 0; }
.embed .top, .embed .crumb, .embed .foot { display: none; }
.embed .rep { max-width: none; padding: 0; }
.embed .rep-card { border: 0; border-radius: 0; padding: 22px 20px 20px; }
.embed .rep-title { padding-inline-end: 52px; font-size: 26px; }

/* رسم توضيحي لقائمة التنزيلات في Chrome وEdge */
.br { background: #292A2D; color: #E8EAED; border-radius: 10px; padding: 14px 16px; direction: ltr; text-align: left; font-family: "Segoe UI", Tahoma, sans-serif; display: grid; gap: 10px; align-content: start; box-shadow: 0 4px 14px rgba(0, 0, 0, .28); }
.br-edge { background: #2B2B2B; }
.br .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.br .row + .row { margin-top: 2px; }
.br .row span { border: 1px solid #8A8D93; border-radius: 3px; padding: 4px 14px; font-size: 12px; color: #fff; display: inline-flex; align-items: center; min-height: 26px; box-sizing: border-box; }
.br .hl { outline: 2px solid #FFD27A; outline-offset: 3px; border-radius: 3px; }
.br .n { flex: none; width: 18px; height: 18px; margin-inline-start: 8px; border-radius: 50%; background: #FFD27A; color: #1B1B1B; font: 700 11px/18px "Segoe UI", Tahoma, sans-serif; text-align: center; }
.br-item { display: flex; align-items: center; gap: 10px; background: #3B3C40; border-radius: 10px; padding: 10px 10px 10px 12px; min-width: 0; }
.br-edge .br-item { background: #3D3D3D; }
.br-item > svg { flex: none; color: #F2B84B; }
.br-name { flex: 1; min-width: 0; display: grid; gap: 2px; font-size: 13px; }
.br-name b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br-name i { font-style: normal; font-size: 11.5px; line-height: 1.35; color: #F2C14E; overflow-wrap: anywhere; }
.br-dots { flex: none; display: inline-flex; color: #fff; padding: 2px 6px; }
.br-item .n { margin-inline-start: 2px; }
.br-step { display: grid; gap: 10px; border-top: 1px solid #55575C; padding-top: 12px; }
.br-title { display: block; margin-block: 4px 2px; font-size: 18px; font-weight: 700; color: var(--fg); }
@media (max-width: 400px) {
  .br { padding: 12px; }
  .br-item { padding: 8px; gap: 6px; }
  .br-item > svg { display: none; }
}

@media (max-width: 900px) {
  .hero, .g-head { grid-template-columns: 1fr; gap: 32px; }
  .dl { position: static; }
  .dl-jump-box { display: grid; gap: 8px; margin-block: 16px 6px; }
  .to-get { display: inline-flex; align-items: center; min-height: 44px; color: var(--fg); font-weight: 600; }
  .dl-bar { position: fixed; inset-inline: 0; bottom: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0, 0, 0, .18); transform: translateY(110%); visibility: hidden; transition: transform .14s ease-in, visibility .14s; }
  .dl-bar.show { transform: none; visibility: visible; transition: transform .24s var(--ease); }
  .dl-bar .btn { flex: none; min-height: 46px; padding-inline: 20px; font-size: 15px; }
  .dl-bar-info { min-width: 0; display: grid; font-weight: 600; line-height: 1.35; }
  .dl-bar-info bdi { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dl-bar-info span { font-size: 12.5px; font-weight: 400; color: var(--muted); }
}
@media (max-width: 900px) and (prefers-reduced-motion: reduce) {
  .dl-bar, .dl-bar.show { transition: none; }
}
@media (max-width: 640px) {
  .app-title { min-height: 3.5em; line-height: 1.75; }
}
@media (max-width: 900px) {
  html { scroll-padding-bottom: 90px; }
}
@media (max-width: 480px) {
  .tech tr { display: block; padding-block: 11px; border-bottom: 1px solid var(--line); }
  .tech tr:last-child { border-bottom: 0; }
  .tech td { display: block; padding: 0; border-bottom: 0; }
  .tech td:first-child { white-space: normal; padding-inline-end: 0; margin-block-end: 2px; }
  .tech td:last-child { text-align: right; }
}
@media (max-width: 400px) {
  .brand { gap: 8px; }
  .brand b { font-size: 18px; }
  .soc { gap: 4px; }
  .top .brand { margin-inline-end: 0; }
}
@media (max-width: 360px) {
  .top { column-gap: 8px; }
  .brand { gap: 6px; }
  .brand b { font-size: 16px; }
  .mark { width: 36px; height: 36px; }
  .soc { gap: 2px; }
}
@media (max-width: 900px) {
  .steps { grid-template-columns: 1fr; }
  .community { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .community { grid-template-columns: 1fr; }
  .comm { grid-template-columns: auto 1fr; }
  .comm-go { display: none; }
  .game:only-child { grid-template-columns: 1fr; }
  .game:only-child .art { min-height: 0; aspect-ratio: 16 / 8; }
  .top { flex-wrap: wrap; row-gap: 4px; padding-block: 14px 6px; }
  .top .nav { order: 3; width: 100%; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); }
  .crumb { display: none; }
  .promises { grid-template-columns: 1fr; }
  .warn { grid-template-columns: 1fr; }
  .page { padding-inline: 16px; }
}

/* فيديو طريقة التركيب: صورة أولاً، ويُحمَّل يوتيوب عند الضغط فقط */
.yt-wrap { margin-block: 6px 22px; }
.yt, .yt-frame { display:block; position:relative; width:100%; max-width:760px; aspect-ratio:16/9; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#000; padding:0; cursor:pointer; }
.yt img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s ease, filter .3s ease; }
@media (hover: hover) {
  .yt:hover img { transform:scale(1.02); filter:brightness(.85); }
}
.yt-play { position:absolute; top:50%; left:24%; transform:translate(-50%,-50%); width:76px; height:54px; border-radius:14px; background:#E62117; box-shadow:0 6px 24px rgba(0,0,0,.45); }
.yt-play::after { content:""; position:absolute; inset:0; margin:auto; width:0; height:0; border-style:solid; border-width:12px 0 12px 20px; border-color:transparent transparent transparent #fff; transform:translateX(3px); }
.yt:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
.yt-cap { margin-block-start:10px; color:var(--muted); font-size:14px; }

@media (max-width:600px){ .yt-play { width:56px; height:40px; border-radius:11px; } .yt-play::after { border-width:9px 0 9px 15px; } }
#how .yt-wrap { margin: 0; }
#how .yt { max-width: none; }
.how-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.how-grid .steps { grid-template-columns: 1fr; gap: 10px; }
.how-grid .steps li { grid-template-columns: auto 1fr; column-gap: 14px; row-gap: 2px; padding: 14px 16px; }
.how-grid .steps li::before { grid-row: span 2; font-size: 26px; }
.how-grid .steps h3 { font-size: 16.5px; }
@media (max-width: 900px) {
  .how-grid { grid-template-columns: 1fr; }
}

/* تنبيه مهم في صفحة اللعبة */
.alert { margin-block: 18px; padding: 14px 16px; border-radius: var(--r); border: 1px solid #C2563F; background: rgba(194, 86, 63, .1); }
.alert b { display: block; margin-block-end: 4px; color: var(--danger); }
.alert p { margin: 0; }
.credit { padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.game.upcoming .art.shot img { object-position: center top; }
.names-note { margin-block-start: 14px; }
.mock-slot { max-width: 460px; margin-block-start: 14px; }

/* زر «الإبلاغ عن مشكلة» في آخر صندوق التنزيل: ثانوي بإطار رفيع، أخف من زر التنزيل */
.btn-report { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; margin-block-start: 4px; border-radius: 12px; border: 1px solid var(--line); color: var(--fg); font-size: 16px; font-weight: 600; text-decoration: none; transition: border-color .15s, background .15s; }
.btn-report svg { color: var(--gold); flex: none; }
.btn-report:hover { border-color: var(--gold); background: var(--scan); }

/* صفحة الإبلاغ عن مشكلة */
.rep { max-width: 720px; margin-inline: auto; padding-block: 18px 0; }
.rep [hidden] { display: none !important; }
.rep-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 36px 36px 30px; }
.rep-form { display: grid; gap: 26px; }
.rep-title { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 5vw, 36px); line-height: 1.4; }
.rep-sub { color: var(--muted); margin-block-start: -16px; }
.fld { display: grid; gap: 10px; min-width: 0; }
.fld > span { font-weight: 700; font-size: 17px; }
.req { color: var(--gold); }
.fld input, .fld select, .fld textarea { width: 100%; font: 400 16.5px/1.6 var(--f-body); color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; transition: border-color .15s; }
.fld select { min-height: 58px; cursor: pointer; appearance: none; padding-inline-end: 42px; }
.fld:has(select) { position: relative; }
.fld:has(select)::after { content: ""; position: absolute; inset-inline-end: 20px; bottom: 25px; width: 9px; height: 9px; border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg); pointer-events: none; }
.fld textarea { resize: vertical; min-height: 130px; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: var(--gold); }
.fld input::placeholder, .fld textarea::placeholder { color: var(--muted); opacity: 1; }
.fld-hint { font-size: 13px; color: var(--muted); margin-block-start: -2px; }
.hp { position: absolute; inset-inline-start: -10000px; width: 1px; height: 1px; overflow: hidden; }
.cf-turnstile { min-height: 65px; }
.rep-send { width: 100%; min-height: 62px; font-size: 19px; font-weight: 700; }
.rep-send[disabled] { opacity: .6; cursor: wait; }
.rep-msg { color: var(--danger); font-weight: 500; margin-block-end: -10px; }
.rep-msg:empty { display: none; }
.rep-alt { color: var(--muted); font-size: 14.5px; }
.rep-alt a { color: var(--gold); text-decoration: none; }
.rep-alt a:hover { text-decoration: underline; }
.rep-done { max-width: 560px; margin-inline: auto; display: grid; justify-items: center; gap: 14px; text-align: center; padding-block: 52px 46px; }
.rep-done:focus { outline: none; }
.rep-ok { width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; color: var(--ok); background: rgba(70, 196, 140, .14); margin-block-end: 8px; }
.rep-done h2 { font-family: var(--f-display); font-size: clamp(24px, 4.5vw, 32px); font-weight: 700; }
.rep-done p { color: var(--muted); margin-block-end: 12px; }
.rep-back { min-width: 240px; background: transparent; }
.rep-id { display: grid; justify-items: center; gap: 4px; width: 100%; max-width: 380px; padding: 16px 18px; margin-block-end: 14px; border: 1px dashed var(--line); border-radius: 12px; background: var(--surface-2); }
.rep-id span { color: var(--muted); font-size: 14px; }
.rep-id b { font-family: var(--f-mono); font-size: 26px; font-weight: 500; letter-spacing: .14em; color: var(--gold); user-select: all; }
.rep-id small { color: var(--muted); font-size: 13px; line-height: 1.6; }
@media (max-width: 640px) {
  .rep-card { padding: 26px 18px 22px; }
}

/* صفحة الروابط (links.html): عمود واحد للجوال، وتبقى كحلية غامقة حتى لو الجهاز على الوضع الفاتح */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #0D1119; --surface: #151B27; --surface-2: #1C2433; --line: #273145;
    --fg: #ECEFF5; --muted: #8F99AE; --gold: #E2AA52; --gold-ink: #1E1606;
    color-scheme: dark;
  }
}
.lk { min-height: 100dvh; display: flex; justify-content: center; padding: max(56px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
  background: radial-gradient(110% 55% at 50% 0%, rgba(226, 170, 82, .11), transparent 62%), var(--bg); }
.lk { position: relative; overflow: hidden; }
.lk-in { position: relative; z-index: 1; width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.lk-logo { display: block; width: 88px; height: 88px; }
.lk h1 { margin-top: 20px; font-family: var(--f-display); font-size: 28px; font-weight: 700; line-height: 1.4; }
.lk-sub { margin-top: 4px; color: var(--muted); font-size: 16px; }
.lk-alias { margin-top: 6px; color: var(--gold); font-family: var(--f-mono); font-size: 14px; font-weight: 500; letter-spacing: .08em; }
.lk-list { list-style: none; margin: 36px 0 0; padding: 0; width: 100%; display: grid; gap: 12px; }
.lk-a { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 20px; text-align: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; color: var(--fg); text-decoration: none;
  font-size: 17px; font-weight: 600; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform .18s var(--ease), background .15s, border-color .15s; }
.lk-a .ic { width: 26px; height: 26px; flex: none; }
.lk-t { flex: 1; display: flex; flex-direction: column; line-height: 1.35; }
